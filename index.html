<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia: Tres Dominios y Clasificación de Seres Vivos</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background 0.3s ease;
        }
        body.correct-flash { background: #1b5e20 !important; }
        body.wrong-flash { background: #b71c1c !important; }
        .quiz-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 550px;
            text-align: center;
        }
        .progress-bar {
            font-weight: bold;
            color: #555;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
        }
        h2 {
            color: #1e3c72;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-option {
            background-color: #f1f3f5;
            color: #212529;
            border: 2px solid #dee2e6;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-weight: 500;
            width: 100%;
        }
        .btn-option:hover:not(:disabled) {
            background-color: #e8ecef;
            border-color: #a1b1c5;
        }
        .text-input-container {
            margin: 20px 0;
        }
        .input-text {
            width: 90%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ced4da;
            border-radius: 8px;
            outline: none;
            text-align: center;
        }
        .btn-submit-text {
            background-color: #1e3c72;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        .btn-correct, .input-correct {
            background-color: #28a745 !important;
            color: white !important;
            border-color: #1e7e34 !important;
        }
        .btn-wrong, .input-wrong {
            background-color: #dc3545 !important;
            color: white !important;
            border-color: #bd2130 !important;
        }
        .feedback-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            text-align: left;
            display: none;
        }
        .feedback-message.correct { background-color: #d4edda; color: #155724; border-left: 5px solid #28a745; }
        .feedback-message.wrong { background-color: #f8d7da; color: #721c24; border-left: 5px solid #dc3545; }
        .btn-next {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            display: none;
            width: 100%;
        }
        .btn-next:hover { background-color: #e65100; }
        .hidden { display: none; }
        #final-msg { font-size: 18px; margin: 20px 0; color: #333; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div id="quiz-screen">
            <div id="progress" class="progress-bar">Pregunta 1 de 15</div>
            <h2 id="question-text">Cargando...</h2>
            <div id="options" class="options-container"></div>
            <div id="text-container" class="text-input-container hidden">
                <input type="text" id="answer-input" class="input-text" placeholder="Escribe tu respuesta aquí...">
                <br>
                <button id="submit-text-btn" class="btn-submit-text" onclick="checkTextAnswer()">Enviar Respuesta</button>
            </div>
            <div id="feedback-box" class="feedback-message"></div>
            <button id="next-btn" class="btn-next" onclick="nextQuestion()">Siguiente Pregunta ➡️</button>
        </div>
        <div id="score-screen" class="hidden">
            <h2>¡Trivia Completada!</h2>
            <div id="final-msg"></div>
            <button class="btn-submit-text" style="background-color:#28a745;" onclick="restartQuiz()">Jugar otra vez</button>
        </div>
    </div>
    <script>
        const quizData = [
            {
                type: "multiple",
                question: "¿Cuáles son los tres dominios oficiales de la clasificación biológica?",
                options: ["Animalia, Plantae y Fungi", "Archaea, Bacteria y Eukarya", "Monera, Protista y Eucariota", "Virus, Bacterias y Mamíferos"],
                correct: 1,
                explain: "Los tres dominios establecidos por Carl Woese son Archaea, Bacteria y Eukarya."
            },
            {
                type: "vf",
                question: "Verdadero o Falso: Los organismos del dominio Archaea son células eucariotas.",
                options: ["Verdadero", "Falso"],
                correct: 1,
                explain: "Falso. Las arqueas son células procariotas primitivas que no tienen un núcleo definido."
            },
            {
                type: "text",
                question: "¿Cuál es el nombre del dominio al que pertenecen los seres humanos, las plantas y los hongos?",
                correct: "eukarya",
                explain: "Pertenecemos al dominio Eukarya (o Eucaria), caracterizado por tener células con núcleo verdadero."
            },
            {
                type: "multiple",
                question: "¿Quién es considerado el padre de la taxonomía moderna por crear el sistema de nomenclatura binomial?",
                options: ["Charles Darwin", "Gregor Mendel", "Carlos Linneo", "Louis Pasteur"],
                correct: 2,
                explain: "Carlos Linneo diseñó el sistema de clasificación y nombre científico que usamos hoy."
            },
            {
                type: "vf",
                question: "Verdadero o Falso: Las bacterias comerciales comunes y las cianobacterias pertenecen al dominio Bacteria.",
                options: ["Verdadero", "Falso"],
                correct: 0,
                explain: "Verdadero. Pertenecen al dominio Bacteria, que agrupa a las bacterias verdaderas o eubacterias."
            },
            {
                type: "multiple",
                question: "¿Qué característica define principalmente a los organismos del dominio Eukarya?",
                options: ["Tienen células procariotas", "Poseen células con núcleo definido y organelos", "Son siempre organismos unicelulares", "No tienen material genético (ADN)"],
                correct: 1,
                explain: "La palabra Eukarya viene del griego y significa 'núcleo verdadero'."
            },
            {
                type: "text",
                question: "¿Cuál es la categoría taxonómica más amplia y generalizada en la clasificación actual (superior al Reino)?",
                correct: "dominio",
                explain: "El Dominio es la categoría taxonómica más alta que agrupa los diferentes reinos."
            },
            {
                type: "multiple",
                question: "¿En qué tipo de ambientes extremos es muy común encontrar a los miembros del dominio Archaea?",
                options: ["Solo en el aire limpio", "Fuentes termales, aguas hipersalinas y fondos volcánicos", "Únicamente dentro de hogares humanos", "En las hojas de árboles frutales"],
                correct: 1,
                explain: "Muchas arqueas son extremófilas, capaces de vivir en condiciones extremas."
            },
            {
                type: "vf",
                question: "Verdadero o Falso: El Reino Fungi (hongos) pertenece al dominio Eukarya.",
                options: ["Verdadero", "Falso"],
                correct: 0,
                explain: "Verdadero. Los hongos son organismos eucariotas."
            },
            {
                type: "multiple",
                question: "Al escribir un nombre científico como 'Homo sapiens', ¿qué representa la primera palabra?",
                options: ["La especie", "La familia", "El género", "El orden"],
                correct: 2,
                explain: "En el sistema binomial, la primera palabra es el Género y la segunda es la Especie."
            },
            {
                type: "text",
                question: "¿A qué reino del dominio Eukarya pertenecen los organismos autótrofos fotosintéticos pluricelulares?",
                correct: "plantae",
                explain: "Pertenecen al reino Plantae (o reino de las plantas)."
            },
            {
                type: "multiple",
                question: "¿Cuál de los siguientes NO es un reino perteneciente al dominio Eukarya?",
                options: ["Reino Animalia", "Reino Plantae", "Reino Monera", "Reino Protista"],
                correct: 2,
                explain: "El antiguo Reino Monera se dividió en los dominios Bacteria y Archaea."
            },
            {
                type: "vf",
                question: "Verdadero o Falso: El dominio es una categoría inferior a la categoría de Especie.",
                options: ["Verdadero", "Falso"],
                correct: 1,
                explain: "Falso. El dominio es la jerarquía máxima y la especie es la básica."
            },
            {
                type: "multiple",
                question: "¿Qué compuesto químico estructural diferencia la pared celular de las bacterias reales del resto de dominios?",
                options: ["Peptidoglicano (mureína)", "Celulosa", "Quitina", "Lípidos ramificados"],
                correct: 0,
                explain: "La pared celular de las bacterias contiene peptidoglicano."
            },
            {
                type: "text",
                question: "¿Qué tipo de organización celular tienen las bacterias y arqueas al carecer de un núcleo celular organizado?",
                correct: "procariota",
                explain: "Son células procariotas cuyo ADN flota libremente en el citoplasma."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        const progressElement = document.getElementById("progress");
        const questionElement = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options");
        const textContainer = document.getElementById("text-container");
        const answerInput = document.getElementById("answer-input");
        const feedbackBox = document.getElementById("feedback-box");
        const nextButton = document.getElementById("next-btn");
        const quizScreen = document.getElementById("quiz-screen");
        const scoreScreen = document.getElementById("score-screen");
        const finalMsgElement = document.getElementById("final-msg");
        const bodyElement = document.body;

        function loadQuestion() {
            optionsContainer.innerHTML = "";
            answerInput.value = "";
            textContainer.classList.add("hidden");
            optionsContainer.classList.add("hidden");
            feedbackBox.style.display = "none";
            nextButton.style.display = "none";
            bodyElement.className = ""; 
            
            document.getElementById("submit-text-btn").disabled = false;
            answerInput.disabled = false;
            answerInput.className = "input-text";

            let currentQuestion = quizData[currentQuestionIndex];
            progressElement.innerText = `Pregunta ${currentQuestionIndex + 1} de ${quizData.length}`;
            questionElement.innerText = currentQuestion.question;

            if (currentQuestion.type === "multiple" || currentQuestion.type === "vf") {
                optionsContainer.classList.remove("hidden");
                currentQuestion.options.forEach((option, index) => {
                    const button = document.createElement("button");
                    button.innerText = option;
                    button.classList.add("btn-option");
                    button.onclick = function() { checkSelectAnswer(index, button); };
                    optionsContainer.appendChild(button);
                });
            } else if (currentQuestion.type === "text") {
                textContainer.classList.remove("hidden");
            }
        }

        function checkSelectAnswer(selectedIndex, clickedButton) {
            let currentQuestion = quizData[currentQuestionIndex];
            const buttons = optionsContainer.querySelectorAll('.btn-option');
            
            buttons.forEach(btn => btn.style.pointerEvents = 'none');

            if (selectedIndex === currentQuestion.correct) {
                score++;
                clickedButton.classList.add('btn-correct');
                bodyElement.className = 'correct-flash';
                showFeedback(true, currentQuestion.explain);
                if(typeof confetti === 'function') confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
            } else {
                clickedButton.classList.add('btn-wrong');
                buttons[currentQuestion.correct].classList.add('btn-correct');
                bodyElement.className = 'wrong-flash';
                showFeedback(false, currentQuestion.explain);
            }

            nextButton.style.display = "block";
        }

        function checkTextAnswer() {
            let currentQuestion = quizData[currentQuestionIndex];
            let userAnswer = answerInput.value.trim().toLowerCase();
            
            if (userAnswer === "") {
                alert("Por favor, escribe una respuesta antes de enviar.");
                return;
            }

            document.getElementById("submit-text-btn").disabled = true;
            answerInput.disabled = true;

            let formattedAnswer = userAnswer.normalize("NFD").replace(/[̀-ͯ]/g, "");
            let formattedCorrect = currentQuestion.correct.normalize("NFD").replace(/[̀-ͯ]/g, "");

            if (formattedAnswer === formattedCorrect || 
               (formattedCorrect === "eukarya" && formattedAnswer === "eucaria")) {
                score++;
                answerInput.className = 'input-text input-correct';
                bodyElement.className = 'correct-flash';
                showFeedback(true, currentQuestion.explain);
                if(typeof confetti === 'function') confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
            } else {
                answerInput.className = 'input-text input-wrong';
                bodyElement.className = 'wrong-flash';
                showFeedback(false, `Incorrecto. La respuesta era: <b>${currentQuestion.correct.toUpperCase()}</b>. ${currentQuestion.explain}`);
            }

            nextButton.style.display = "block";
        }

        function showFeedback(isCorrect, text) {
            feedbackBox.style.display = "block";
            if (isCorrect) {
                feedbackBox.className = "feedback-message correct";
                feedbackBox.innerHTML = `🎉 ¡Correcto! ${text}`;
            } else {
                feedbackBox.className = "feedback-message wrong";
                feedbackBox.innerHTML = `❌ ${text}`;
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.classList.add("hidden");
            scoreScreen.classList.remove("hidden");
            bodyElement.className = "";

            let porcentaje = Math.round((score / quizData.length) * 100);
            let mensaje = "";

            if (score === 15) {
                mensaje = `🏆 ¡Perfecto! Respondiste las 15 preguntas correctamente.<br>¡Eres el maestro supremo de los seres vivos!`;
                if(typeof confetti === 'function') {
                    let duration = 3 * 1000;
                    let end = Date.now() + duration;
                    (function frame() {
                        confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0 } });
                        confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1 } });
                        if (Date.now() < end) requestAnimationFrame(frame);
                    }());
                }
            } else if (score >= 10) {
                mensaje = `✨ ¡Excelente trabajo! Tienes bases muy sólidas.<br>Lograste <b>${score} aciertos</b> de 15 (${porcentaje}%).`;
            } else if (score >= 6) {
                mensaje = `👍 Buen intento. Obtuviste <b>${score} aciertos</b> de 15 (${porcentaje}%).<br>¡Puedes mejorar!`;
            } else {
                mensaje = `🙃 ¡Sigue estudiando! Solo acertaste <b>${score}</b> de 15.<br>Inténtalo de nuevo.`;
            }

            finalMsgElement.innerHTML = mensaje;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            scoreScreen.classList.add("hidden");
            quizScreen.classList.remove("hidden");
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
